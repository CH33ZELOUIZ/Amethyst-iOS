name: Duo private verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run source and redaction regressions
        run: python3 -m pytest tests

  build:
    runs-on: xcode-27
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          architecture: aarch64
      - name: Build tools
        run: brew install cmake ldid wget make
      - name: Build private test IPA (nonpublishing)
        run: |
          export PATH="$(brew --prefix)/opt/make/libexec/gnubin:$(brew --prefix)/bin:$PATH"
          gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2 DUO_PRIVATE_BUILD=1 BOOTJDK="$JAVA_HOME/bin"
          test -n "$(find artifacts -maxdepth 1 -name '*.ipa' -print -quit)"
      - name: Retain IPA for this run only
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Duo-private-test-ipa
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7
