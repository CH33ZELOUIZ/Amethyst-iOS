name: SDK probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - run: |
          H=/Applications/Xcode_27.1.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS27.1.sdk/System/Library/Frameworks/UIKit.framework/Headers
          grep -v "^\s*///" $H/UIHinge.h | grep -v '^\s*$'
          echo =========RR
          grep -v "^\s*///" $H/UIViewReservedRegion.h | grep -v '^\s*$'
